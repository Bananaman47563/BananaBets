<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD60A">
<meta name="description" content="BananaBets: a personal sports dashboard with scores, stats, odds and statistical estimates. Research only; no betting.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>BananaBets</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#/" aria-label="BananaBets home">
      <img src="icon.svg" alt="" width="34" height="34">
      <span>BananaBets</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="home">Home</a>
      <a href="#/nfl" data-tab="nfl">NFL</a>
      <a href="#/nba" data-tab="nba">NBA</a>
      <a href="#/mlb" data-tab="mlb">MLB</a>
      <a href="#/ufc" data-tab="ufc">UFC</a>
      <a href="#/markets" data-tab="markets">Markets</a>
      <a href="#/predictions" data-tab="predictions">Predictions</a>
      <a href="#/record" data-tab="record">Record</a>
      <a href="#/settings" data-tab="settings">Settings</a>
    </nav>
  </header>
  <div class="status-bar">
    <span id="updated" class="muted">Loading…</span>
    <button id="refresh" class="ghost" type="button">Refresh</button>
  </div>
  <main id="view" aria-live="polite"><p class="muted">Loading…</p></main>
  <footer class="foot">
    Scores and stats come from ESPN's public, unofficial site API. Times are Central.
    Estimates are for research only. BananaBets does not connect to any sportsbook and does not place bets.
  </footer>
</div>
<script src="app.js?v=8"></script>
</body>
</html>
