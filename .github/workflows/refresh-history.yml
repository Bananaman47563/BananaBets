name: Refresh game history

# Rebuilds data/nfl.json and data/nba.json once a week from ESPN's public scoreboards.
on:
  schedule:
    - cron: "15 9 * * 1"        # Mondays, 9:15 UTC
  workflow_dispatch:             # also runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild history files
        run: python scripts/build_history.py
      - name: Commit if changed
        run: |
          git config user.name "bananabets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh game history"
            git push
          fi
